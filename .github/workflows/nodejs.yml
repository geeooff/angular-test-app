# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-nodejs-with-github-actions

name: Node.js CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    # "current" tracks whatever Node just shipped, so it can carry upstream
    # regressions (e.g. https://github.com/actions/runner-images/issues/14173)
    # that have nothing to do with this repo. Don't let those block the build.
    continue-on-error: ${{ matrix.node-version == 'current' }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
        node-version:
          - current
          - lts/*
        architecture:
          - x64
    defaults:
      run:
        working-directory: my-app
    steps:
    - uses: actions/checkout@v7
    - name: Use Node.js ${{ matrix.node-version }} - ${{ matrix.architecture }} on ${{ matrix.os }}
      uses: actions/setup-node@v7
      with:
        node-version: ${{ matrix.node-version }}
        architecture: ${{ matrix.architecture }}
        cache: 'npm'
        cache-dependency-path: '**/package-lock.json'
    - run: npm install -g @angular/cli
    - run: npm ci
      env:
        PUPPETEER_SKIP_DOWNLOAD: 'true'
    - run: npx puppeteer browsers install chrome
    - run: npm run build
    - run: npm run test:ci
